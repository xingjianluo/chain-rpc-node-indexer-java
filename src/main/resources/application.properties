# 本地演示固定端口；测试通过 @DynamicPropertySource / @SpringBootTest(webEnvironment) 覆盖
server.port=8080

# 区块持久化目录（重启恢复）
app.data-dir=./data/blocks
# 单次 RPC 请求超时（毫秒）
app.request-timeout-ms=1000
# 连续失败多少次判为不可用
app.failure-threshold=3
# 不可用节点需连续成功多少次才恢复
app.recovery-successes=2
# 节点高度落后集群最高多少块视为滞后
app.lag-threshold-blocks=5
# 索引器轮询间隔（毫秒）
app.poll-interval-ms=500

# 模拟链与三个本地上游节点（全部指向本进程的模拟端点）
app.sim.enabled=true
app.sim.initial-block-count=5
app.nodes[0].id=node-a
app.nodes[0].endpoint=http://127.0.0.1:${server.port}/sim/node-a
app.nodes[0].enabled=true
app.nodes[1].id=node-b
app.nodes[1].endpoint=http://127.0.0.1:${server.port}/sim/node-b
app.nodes[1].enabled=true
app.nodes[2].id=node-c
app.nodes[2].endpoint=http://127.0.0.1:${server.port}/sim/node-c
app.nodes[2].enabled=true
