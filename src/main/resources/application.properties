# ===== HTTP 服务端口（本地演示固定 8080；测试用 @SpringBootTest 会覆盖为 0）=====
server.port=8080

# ===== 本地区块存储目录（重启后从该文件恢复，原子提交）=====
app.data-dir=./data

# ===== 节点健康判定 =====
# 连续失败多少次判定 UNAVAILABLE（偶发抖动不判死）
app.health.fail-threshold=3
# PROBING 恢复需要连续成功次数（单次侥幸成功不恢复）
app.health.recover-successes=2
# UNAVAILABLE 节点冷却多久后允许放一次探测（毫秒）
app.health.probe-cooldown-millis=1000
# 与网络最佳高度相差超过该值即标记 LAGGING
app.health.lag-threshold=2
# 主动探测定时间隔（毫秒）：探测所有节点最新高度，用于发现滞后/恢复不可用节点
app.health.probe-interval-millis=2000

# ===== 索引器 =====
app.indexer.enabled=true
# 同步轮询间隔（毫秒）
app.indexer.tick-millis=500
# 每轮最多处理多少个块（含重组重建）
app.indexer.max-blocks-per-tick=100

# ===== 本地模拟链 =====
# 启动时预置区块数（含创世块）
app.simulated.chain-height=12
# 模拟出块间隔（毫秒）
app.simulated.mine-interval-millis=3000

# 上游节点：留空时默认装配 node-a/node-b/node-c（node-c 预置滞后 3）
# 需要真实 HTTP 节点时可按下列方式配置：
# app.upstreams[0].name=local-http
# app.upstreams[0].type=http
# app.upstreams[0].url=http://127.0.0.1:9000
# app.upstreams[0].timeout-millis=1000
# app.upstreams[1].name=mock
# app.upstreams[1].type=simulated
# app.upstreams[1].lag-by=0
